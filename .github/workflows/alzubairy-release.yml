name: Build Alzubairy Remote

on:
  workflow_dispatch:
  push:
    branches:
      - worktree-port-forward-shared-conn
    paths:
      - ".github/workflows/alzubairy-release.yml"
      - "src/**"
      - "flutter/android/**"
      - "flutter/windows/**"
      - "branding/**"

permissions:
  contents: write
  actions: read

concurrency:
  group: alzubairy-release
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: alzubairy-beta
